name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      # Reads the Node version from .nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails if pnpm-lock.yaml is missing or out of date.
      - run: pnpm install --frozen-lockfile

      # The toolchain that is actually running must equal the pins.
      - run: pnpm check:toolchain
      - run: pnpm check:versions
      - run: pnpm check:links
      - run: pnpm check:secrets
      - run: pnpm check:env-docs
      - run: pnpm check:deploy
      - run: pnpm check:ci

      - run: pnpm format:check
      - run: pnpm lint
      # `turbo run` covers every workspace that defines the script (check:versions enforces that).
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Known-vulnerability scan of production dependencies.
      - run: pnpm audit --prod --audit-level=high

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: livecontrol_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d livecontrol_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci_only_password@localhost:5432/livecontrol_ci
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke:health
      - run: pnpm smoke:web

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/service.Dockerfile --build-arg SERVICE=realtime -t live-control-realtime:ci .
      - run: docker build -f infra/docker/service.Dockerfile --build-arg SERVICE=worker -t live-control-worker:ci .
